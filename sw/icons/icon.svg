<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hintergrund -->
  <rect width="192" height="192" rx="38" fill="#0d0d0d"/>

  <!-- Mikrofon-Gruppe mit Glow -->
  <g filter="url(#glow)" stroke="#4dff4d" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="7">
    <!-- Mikrofon-Kapsel -->
    <rect x="72" y="26" width="48" height="84" rx="24"/>
    <!-- Stativbogen -->
    <path d="M 50 96 Q 50 148 96 148 Q 142 148 142 96"/>
    <!-- Stiel -->
    <line x1="96" y1="148" x2="96" y2="168"/>
    <!-- Fuß -->
    <line x1="64" y1="168" x2="128" y2="168"/>
  </g>
</svg>
