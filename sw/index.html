<!DOCTYPE html>
<html lang="de-DE">
<!-- DictoPhone ist eine kleine Diktier-App fuer Whatsapp, (C)JoEmbedded -->
 <head>

    <!-- WICHTIG: http://localhost/wrk/ai/dictophone/sw/index.html  -->
     <!-- mit Live-Server kann PHP nicht gestestet werden, XAMPP verwenden. -->
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4dff4d">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./css/dictophone.css">
    <script src="./js/dictophone.js" type="module" defer></script>

    <title>DictoPhone</title>
</head>

<body>
    <div class="container">
        <div class="controls">
            <button id="record-btn" class="recording-off">Aufnehmen</button>
            <button id="correct-btn">Korrigieren</button>
            <button id="whatsapp-btn">An WhatsApp</button>
            <button id="copy-btn">Kopieren</button>
            <!-- <button id="undo-btn">Zurück</button>  Undo erstmal noch nicht als Button -->
            <div class="btn-pair">
                <button id="info-btn">(&#x2139;)</button>
                <button id="reload-btn" title="Seite neu laden">&#x21bb;</button>
                <button id="del-btn">&#x2715;</button>
            </div>
        </div>
        <textarea id="output" inputmode="none" placeholder="Warte auf Eingabe..."></textarea>
    </div>

    <dialog id="msg-dialog">
        <h3 id="msg-title">Titel</h3>
        <p id="msg-text">Text</p>
        <button id="msg-ok">OK</button>
    </dialog>


    <dialog id="confirm-dialog">
        <h3 id="confirm-title">Bestätigen</h3>
        <p id="confirm-text">Soll der Text wirklich gelöscht werden?</p>
        <div class="confirm-actions">
            <button id="confirm-cancel">Abbrechen</button>
            <button id="confirm-ok">Löschen</button>
        </div>
    </dialog>

    <dialog id="spinner-dialog">
        <h3 id="spinner-title">Titel</h3>
        <p id="spinner-text">Text</p>
    </dialog>

</body>

</html>
